<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Skor Taekwondo - Professional</title>
  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .top-header { text-align: center; margin-bottom: 10px; }
    .round-title { font-size: 26px; font-weight: bold; color: #ffc107; letter-spacing: 2px; }
    .timer { font-size: 75px; font-weight: bold; letter-spacing: 3px; color: #ffffff; margin-top: 2px; }
    
    .main-container {
      display: flex;
      gap: 25px;
      width: 100%;
      max-width: 1250px;
      justify-content: center;
      align-items: stretch;
    }
    .corner {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      border-radius: 20px;
      padding: 35px 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .red-corner { background: linear-gradient(135deg, #a71d2a 0%, #dc3545 100%); border: 3px solid #ff4d4d; }
    .blue-corner { background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%); border: 3px solid #4da6ff; }
    .corner-name { font-size: 40px; font-weight: 900; letter-spacing: 3px; }
    .score-display { font-size: 180px; font-weight: bold; line-height: 1; margin: 15px 0; }
    
    .btn-minus {
      background-color: rgba(0, 0, 0, 0.4);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-minus:hover { background-color: rgba(0, 0, 0, 0.7); }

    .history-box {
      flex: 1.1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .history-title { font-size: 15px; font-weight: bold; color: #ffc107; margin-bottom: 12px; letter-spacing: 1px; }
    .history-table { width: 100%; font-size: 14px; text-align: center; border-collapse: collapse; }
    .history-table th, .history-table td { padding: 8px; border-bottom: 1px solid #30363d; }

    .control-panel { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    
    button.ctrl-btn {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s;
    }
    button.ctrl-btn:disabled { opacity: 0.35 !important; cursor: not-allowed !important; }
    
    .btn-start { background-color: #28a745; }
    .btn-pause { background-color: #ffc107; color: black !important; }
    .btn-stop { background-color: #dc3545; }
    .btn-action { background-color: #17a2b8; }
    .btn-danger { background-color: #d9534f; }
    .btn-pdf { background-color: #6f42c1; }

    .time-setter {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #161b22;
      padding: 6px 15px;
      border-radius: 8px;
      border: 1px solid #30363d;
    }
    .time-setter input {
      width: 50px; text-align: center; background: #0b0e14; color: white; border: 1px solid #444; padding: 5px; border-radius: 4px;
    }
    .time-setter input:disabled { opacity: 0.5; cursor: not-allowed; }
    #pdf-template { display: none; }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="round-title" id="round-label">ROUND 1</div>
    <div class="timer" id="timer-display">02:00</div>
  </div>

  <div class="main-container">
    <div class="corner red-corner">
      <div class="corner-name">MERAH</div>
      <div class="score-display" id="score-red">0</div>
      <button class="btn-minus" onclick="kurangiSkor('red')">-1 Point</button>
    </div>

    <div class="history-box">
      <div class="history-title">RIWAYAT RONDE & JURI</div>
      <table class="history-table">
        <thead>
          <tr>
            <th>Ronde</th>
            <th style="color:#ff4d4d">Merah</th>
            <th style="color:#4da6ff">Biru</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <tr>
            <td>1</td>
            <td id="h-red-1">0</td>
            <td id="h-blue-1">0</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="corner blue-corner">
      <div class="corner-name">BIRU</div>
      <div class="score-display" id="score-blue">0</div>
      <button class="btn-minus" onclick="kurangiSkor('blue')">-1 Point</button>
    </div>
  </div>

  <div class="control-panel">
    <div class="btn-group">
      <button id="btn-start" class="ctrl-btn btn-start" onclick="mulaiTimer()">Start</button>
      <button id="btn-pause" class="ctrl-btn btn-pause" onclick="pauseTimer()">Pause</button>
      <button id="btn-stop" class="ctrl-btn btn-stop" onclick="stopTimer()">Stop</button>
    </div>

    <div class="time-setter">
      <span>Set:</span>
      <input type="number" id="input-m" value="2" min="0"> m
      <input type="number" id="input-s" value="0" min="0" max="59"> s
      <button id="btn-set" class="ctrl-btn btn-action" style="padding: 5px 15px;" onclick="aturWaktuCustom()">Set</button>
    </div>

    <div class="btn-group">
      <button id="btn-next" class="ctrl-btn btn-action" onclick="nextRonde()">Manual Next Ronde</button>
      <button id="btn-reset" class="ctrl-btn btn-danger" onclick="resetPertandingan()">Reset Pertandingan</button>
      <button id="btn-pdf" class="ctrl-btn btn-pdf" onclick="downloadPDF()">Download PDF</button>
    </div>
  </div>

  <!-- Template PDF Tersembunyi -->
  <div id="pdf-template" style="background: white; color: black; padding: 25px; font-family: Arial, sans-serif; width: 850px; margin: 0 auto;">
    <h2 style="text-align: center; margin-bottom: 5px; font-size: 20px;">HASIL PERTANDINGAN TAEKWONDO</h2>
    <div id="pdf-timestamp" style="text-align: center; font-size: 12px; color: #555; margin-bottom: 20px;"></div>
    
    <table style="width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; margin-bottom: 20px;">
      <thead>
        <tr style="background-color: #2980b9; color: white;">
          <th style="padding: 8px; border: 1px solid #ddd;">Ronde</th>
          <th style="padding: 8px; border: 1px solid #ddd;">Skor Merah</th>
          <th style="padding: 8px; border: 1px solid #ddd;">Skor Biru</th>
          <th style="padding: 8px; border: 1px solid #ddd;">Pemenang Ronde</th>
        </tr>
      </thead>
      <tbody id="pdf-table-body"></tbody>
    </table>

    <h3 style="font-size: 14px; margin-bottom: 8px; color: #333;">DETAIL JURI PEMBERI SKOR:</h3>
    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 12px;">
      <thead>
        <tr style="background-color: #444; color: white;">
          <th style="padding: 6px; border: 1px solid #ddd;">Ronde</th>
          <th style="padding: 6px; border: 1px solid #ddd;">Sudut</th>
          <th style="padding: 6px; border: 1px solid #ddd;">Juri yang Menyetujui</th>
        </tr>
      </thead>
      <tbody id="pdf-judge-body"></tbody>
    </table>
  </div>

  <script>
    const pusher = new Pusher('1c192663177ea6b128ac', { cluster: 'ap1' });
    const channel = pusher.subscribe('taekwondo-channel');

    let scores = { red: 0, blue: 0 };
    let currentRound = 1;
    let roundScores = { 1: { red: 0, blue: 0, logs: [] } };
    let timeLeft = 120;
    let timerId = null;

    channel.bind('score-updated', function(data) {
      if (data.team === 'red') scores.red += Number(data.points);
      if (data.team === 'blue') scores.blue += Number(data.points);

      roundScores[currentRound].red = scores.red;
      roundScores[currentRound].blue = scores.blue;
      roundScores[currentRound].logs.push({ team: data.team, judges: data.judges });

      updateTampilan();
    });

    function kurangiSkor(team) {
      if (team === 'red' && scores.red > 0) scores.red -= 1;
      if (team === 'blue' && scores.blue > 0) scores.blue -= 1;

      roundScores[currentRound].red = scores.red;
      roundScores[currentRound].blue = scores.blue;
      updateTampilan();
    }

    function updateTampilan() {
      document.getElementById('score-red').innerText = scores.red;
      document.getElementById('score-blue').innerText = scores.blue;
      document.getElementById(`h-red-${currentRound}`).innerText = scores.red;
      document.getElementById(`h-blue-${currentRound}`).innerText = scores.blue;
    }

    function updateTimerDisplay() {
      let m = Math.floor(timeLeft / 60);
      let s = timeLeft % 60;
      document.getElementById('timer-display').innerText = 
        `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function setControlsDisabled(disabled) {
      document.getElementById('btn-start').disabled = disabled;
      document.getElementById('btn-set').disabled = disabled;
      document.getElementById('input-m').disabled = disabled;
      document.getElementById('input-s').disabled = disabled;
      document.getElementById('btn-next').disabled = disabled;
      document.getElementById('btn-reset').disabled = disabled;
      document.getElementById('btn-pdf').disabled = disabled;
    }

    async function mulaiTimer() {
      if (timerId !== null) return;
      
      await fetch('/api/control', { 
        method: 'POST', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify({ action: 'start' }) 
      });

      setControlsDisabled(true);

      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          pauseTimer();
          alert('Waktu ronde habis! Otomatis pindah ke ronde berikutnya.');
          nextRonde();
        }
      }, 1000);
    }

    async function pauseTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      setControlsDisabled(false);

      await fetch('/api/control', { 
        method: 'POST', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify({ action: 'pause' }) 
      });
    }

    async function stopTimer() {
      await pauseTimer();
      timeLeft = 120;
      updateTimerDisplay();

      await fetch('/api/control', { 
        method: 'POST', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify({ action: 'stop' }) 
      });
    }

    function aturWaktuCustom() {
      let m = parseInt(document.getElementById('input-m').value) || 0;
      let s = parseInt(document.getElementById('input-s').value) || 0;
      timeLeft = (m * 60) + s;
      updateTimerDisplay();
    }

    async function nextRonde() {
      await pauseTimer();
      currentRound++;
      scores.red = 0;
      scores.blue = 0;
      roundScores[currentRound] = { red: 0, blue: 0, logs: [] };
      updateTampilan();

      let tbody = document.getElementById('history-body');
      let tr = document.createElement('tr');
      tr.innerHTML = `<td>${currentRound}</td><td id="h-red-${currentRound}">0</td><td id="h-blue-${currentRound}">0</td>`;
      tbody.appendChild(tr);

      document.getElementById('round-label').innerText = `ROUND ${currentRound}`;
      timeLeft = 120;
      updateTimerDisplay();
    }

    async function resetPertandingan() {
      if (confirm('Yakin ingin mereset seluruh pertandingan?')) {
        await pauseTimer();
        scores = { red: 0, blue: 0 };
        currentRound = 1;
        roundScores = { 1: { red: 0, blue: 0, logs: [] } };
        timeLeft = 120;
        document.getElementById('round-label').innerText = 'ROUND 1';
        document.getElementById('history-body').innerHTML = `<tr><td>1</td><td id="h-red-1">0</td><td id="h-blue-1">0</td></tr>`;
        updateTampilan();
        updateTimerDisplay();

        await fetch('/api/control', { 
          method: 'POST', 
          headers: {'Content-Type': 'application/json'}, 
          body: JSON.stringify({ action: 'reset' }) 
        });
      }
    }

    function downloadPDF() {
      let pdfBody = '';
      let judgeBody = '';
      let totalRed = 0;
      let totalBlue = 0;

      for (let r = 1; r <= currentRound; r++) {
        let rRed = roundScores[r] ? roundScores[r].red : 0;
        let rBlue = roundScores[r] ? roundScores[r].blue : 0;
        totalRed += rRed;
        totalBlue += rBlue;

        let winner = "SERI";
        if (rRed > rBlue) winner = "MERAH";
        else if (rBlue > rRed) winner = "BIRU";

        pdfBody += `
          <tr>
            <td style="padding: 8px; border: 1px solid #ddd;">Ronde ${r}</td>
            <td style="padding: 8px; border: 1px solid #ddd; color: #d9534f; font-weight: bold;">${rRed}</td>
            <td style="padding: 8px; border: 1px solid #ddd; color: #0275d8; font-weight: bold;">${rBlue}</td>
            <td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">${winner}</td>
          </tr>
        `;

        if (roundScores[r] && roundScores[r].logs.length > 0) {
          roundScores[r].logs.forEach((log, idx) => {
            let teamName = log.team === 'red' ? 'MERAH' : 'BIRU';
            let colorStyle = log.team === 'red' ? 'color: #d9534f;' : 'color: #0275d8;';
            let judgesStr = log.judges.map(j => `Juri ${j}`).join(', ');
            judgeBody += `
              <tr>
                <td style="padding: 5px; border: 1px solid #ddd;">Ronde ${r} (Poin #${idx+1})</td>
                <td style="padding: 5px; border: 1px solid #ddd; font-weight: bold; ${colorStyle}">${teamName}</td>
                <td style="padding: 5px; border: 1px solid #ddd;">${judgesStr}</td>
              </tr>
            `;
          });
        }
      }

      if (judgeBody === '') {
        judgeBody = `<tr><td colspan="3" style="padding: 6px; border: 1px solid #ddd; text-align: center;">Tidak ada catatan poin masuk.</td></tr>`;
      }

      let overallWinner = "SERI (IMBANG)";
      if (totalRed > totalBlue) overallWinner = "MERAH (PEMENANG)";
      else if (totalBlue > totalRed) overallWinner = "BIRU (PEMENANG)";

      pdfBody += `
        <tr style="background-color: #f2f2f2; font-weight: bold;">
          <td style="padding: 10px; border: 1px solid #ddd;">TOTAL SKOR</td>
          <td style="padding: 10px; border: 1px solid #ddd; color: #d9534f; font-size: 15px;">${totalRed}</td>
          <td style="padding: 10px; border: 1px solid #ddd; color: #0275d8; font-size: 15px;">${totalBlue}</td>
          <td style="padding: 10px; border: 1px solid #ddd;">${overallWinner}</td>
        </tr>
      `;

      document.getElementById('pdf-table-body').innerHTML = pdfBody;
      document.getElementById('pdf-judge-body').innerHTML = judgeBody;

      let now = new Date();
      let timeString = `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}, ${now.getHours().toString().padStart(2,'0')}.${now.getMinutes().toString().padStart(2,'0')}`;
      document.getElementById('pdf-timestamp').innerText = `Waktu Cetak: ${timeString}`;

      const element = document.getElementById('pdf-template');
      element.style.display = 'block';

      const opt = {
        margin:       10,
        filename:     'Hasil_Pertandingan_Taekwondo.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().from(element).set(opt).save().then(() => {
        element.style.display = 'none';
      });
    }
  </script>

</body>
</html>
