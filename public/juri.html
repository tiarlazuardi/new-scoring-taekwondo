<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Juri Taekwondo</title>
  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
    }
    .status-bar {
      background: #1a1a1a;
      color: #ffc107;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
      width: 100%;
      text-align: center;
      border: 1px solid #333;
    }
    .judge-selector {
      margin: 10px 0;
      font-size: 14px;
      color: #ccc;
    }
    .judge-selector select {
      background: #222;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #555;
      font-size: 14px;
      font-weight: bold;
    }
    .button-container {
      display: flex;
      width: 100%;
      flex: 1;
      gap: 15px;
      margin-bottom: 10px;
    }
    .btn-vote {
      flex: 1;
      border-radius: 16px;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      border: 2px solid transparent;
    }
    .btn-red {
      background-color: #dc3545;
      color: #ffffff;
      border-color: #ff4d4d;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
    }
    .btn-blue {
      background-color: #0d6efd;
      color: #ffffff;
      border-color: #4da6ff;
      box-shadow: 0 4px 15px rgba(13, 110, 253, 0.4);
    }
    .btn-vote:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="status-bar" id="status-text">SIAP MENILAI</div>

  <div class="judge-selector">
    Perangkat Ini: 
    <select id="judge-id" onchange="simpanJudgeId()">
      <option value="1">Juri 1</option>
      <option value="2">Juri 2</option>
      <option value="3">Juri 3</option>
    </select>
  </div>

  <div class="button-container">
    <div class="btn-vote btn-red" onclick="kirimVote('red')">+1 MERAH</div>
    <div class="btn-vote btn-blue" onclick="kirimVote('blue')">+1 BIRU</div>
  </div>

  <script>
    const pusher = new Pusher('1c192663177ea6b128ac', { cluster: 'ap1' });
    const channel = pusher.subscribe('taekwondo-channel');

    function getJudgeId() {
      return document.getElementById('judge-id').value;
    }

    function simpanJudgeId() {
      localStorage.setItem('taekwondo_judge_id', getJudgeId());
    }

    window.onload = function() {
      let savedId = localStorage.getItem('taekwondo_judge_id');
      if (savedId) {
        document.getElementById('judge-id').value = savedId;
      }
    }

    // Opsional: Ikut mendengarkan status start/pause dari operator
    channel.bind('control-action', function(data) {
      const statusBar = document.getElementById('status-text');
      if (data.action === 'start') {
        statusBar.innerText = "PERTANDINGAN BERJALAN";
        statusBar.style.color = "#4dff4d";
      } else if (data.action === 'pause' || data.action === 'stop') {
        statusBar.innerText = "PERTANDINGAN DI-PAUSE / STOP";
        statusBar.style.color = "#ffc107";
      }
    });

    async function kirimVote(team) {
      try {
        const response = await fetch('/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ judgeId: getJudgeId(), team })
        });
        const result = await response.json();
        console.log('Vote terkirim:', result);
      } catch (error) {
        console.error('Gagal mengirim vote:', error);
        alert('Gagal terhubung ke server!');
      }
    }
  </script>

</body>
</html>
