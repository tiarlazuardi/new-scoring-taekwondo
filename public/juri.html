<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Juri Taekwondo</title>
  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
    }
    .status-bar {
      background: #1a1a1a;
      color: #4dff4d;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      letter-spacing: 1px;
      width: 100%;
      text-align: center;
      border: 1px solid #333;
    }
    .judge-selector {
      margin: 5px 0;
      font-size: 14px;
      color: #ccc;
    }
    .judge-selector select {
      background: #222;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #555;
      font-size: 14px;
      font-weight: bold;
    }
    .button-container {
      display: flex;
      width: 100%;
      flex: 1;
      gap: 15px;
      margin-bottom: 10px;
    }
    .btn-vote {
      flex: 1;
      border-radius: 16px;
      font-size: 26px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.1s;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      border: 2px solid;
    }
    .btn-red {
      background-color: #dc3545;
      color: #ffffff;
      border-color: #ff4d4d;
      box-shadow: 0 0 20px rgba(220, 53, 69, 0.6);
    }
    .btn-blue {
      background-color: #0d6efd;
      color: #ffffff;
      border-color: #4da6ff;
      box-shadow: 0 0 20px rgba(13, 110, 253, 0.6);
    }
    .btn-vote:active {
      transform: scale(0.92);
      opacity: 0.8;
    }
    .countdown-text {
      font-size: 14px;
      font-weight: normal;
      margin-top: 8px;
      color: #ffeb3b;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="status-bar" id="status-text">PANEL JURI SIAP DIGUNAKAN</div>

  <div class="judge-selector">
    Perangkat Ini: 
    <select id="judge-id" onchange="simpanJudgeId()">
      <option value="1">Juri 1</option>
      <option value="2">Juri 2</option>
      <option value="3">Juri 3</option>
    </select>
  </div>

  <div class="button-container">
    <!-- Menggunakan event ontouchend dan onclick agar responsif di iPhone & Android -->
    <div class="btn-vote btn-red" onclick="kirimVote('red')">
      <span>+1 MERAH</span>
      <div class="countdown-text" id="cd-red"></div>
    </div>
    <div class="btn-vote btn-blue" onclick="kirimVote('blue')">
      <span>+1 BIRU</span>
      <div class="countdown-text" id="cd-blue"></div>
    </div>
  </div>

  <script>
    const pusher = new Pusher('1c192663177ea6b128ac', { cluster: 'ap1' });
    const channel = pusher.subscribe('taekwondo-channel');

    function getJudgeId() {
      return document.getElementById('judge-id').value;
    }

    function simpanJudgeId() {
      localStorage.setItem('taekwondo_judge_id', getJudgeId());
    }

    window.onload = function() {
      let savedId = localStorage.getItem('taekwondo_judge_id');
      if (savedId) {
        document.getElementById('judge-id').value = savedId;
      }
    }

    async function kirimVote(team) {
      let cdElement = document.getElementById(`cd-${team}`);
      let timeLeft = 1.0;
      cdElement.innerText = "Menunggu (1.0s)...";

      let interval = setInterval(() => {
        timeLeft -= 0.2;
        if (timeLeft > 0) {
          cdElement.innerText = `Menunggu (${timeLeft.toFixed(1)}s)...`;
        } else {
          clearInterval(interval);
          cdElement.innerText = "";
        }
      }, 200);

      try {
        let response = await fetch('/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ judgeId: getJudgeId(), team })
        });
        let result = await response.json();
        console.log('Respon server:', result);
      } catch (error) {
        console.error('Gagal mengirim vote:', error);
        clearInterval(interval);
        cdElement.innerText = "Gagal Kirim!";
      }
    }
  </script>

</body>
</html>
