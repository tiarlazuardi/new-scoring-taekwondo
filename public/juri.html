<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Juri Taekwondo</title>
  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
    }
    .status-bar {
      background: #1a1a1a;
      color: #ffc107;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
      width: 100%;
      text-align: center;
      border: 1px solid #333;
    }
    .judge-selector {
      margin: 10px 0;
      font-size: 14px;
      color: #ccc;
    }
    .judge-selector select {
      background: #222;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #555;
      font-size: 14px;
      font-weight: bold;
    }
    .button-container {
      display: flex;
      width: 100%;
      flex: 1;
      gap: 15px;
      margin-bottom: 10px;
    }
    .btn-vote {
      flex: 1;
      border: 2px dashed #444;
      border-radius: 16px;
      font-size: 28px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: not-allowed;
      transition: all 0.2s;
      opacity: 0.25;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-red {
      background-color: #3d1418;
      color: #888;
      border-color: #555;
    }
    .btn-blue {
      background-color: #122847;
      color: #888;
      border-color: #555;
    }
    /* Ketika Timer Berjalan (Aktif & Menyala) */
    .active-vote {
      opacity: 1 !important;
      cursor: pointer !important;
      border-style: solid !important;
    }
    .active-vote.btn-red {
      background-color: #dc3545;
      color: #ffffff;
      border-color: #ff4d4d;
      box-shadow: 0 0 15px rgba(220, 53, 69, 0.4);
    }
    .active-vote.btn-blue {
      background-color: #0d6efd;
      color: #ffffff;
      border-color: #4da6ff;
      box-shadow: 0 0 15px rgba(13, 110, 253, 0.4);
    }
    .active-vote:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="status-bar" id="status-text">MEMUAT STATUS...</div>

  <div class="judge-selector">
    Perangkat Ini: 
    <select id="judge-id" onchange="simpanJudgeId()">
      <option value="1">Juri 1</option>
      <option value="2">Juri 2</option>
      <option value="3">Juri 3</option>
    </select>
  </div>

  <div class="button-container">
    <div id="btn-red" class="btn-vote btn-red" onclick="kirimVote('red')">+1 MERAH</div>
    <div id="btn-blue" class="btn-vote btn-blue" onclick="kirimVote('blue')">+1 BIRU</div>
  </div>

  <script>
    const pusher = new Pusher('1c192663177ea6b128ac', { cluster: 'ap1' });
    const channel = pusher.subscribe('taekwondo-channel');

    let timerIsRunning = false;

    function getJudgeId() {
      return document.getElementById('judge-id').value;
    }

    function simpanJudgeId() {
      localStorage.setItem('taekwondo_judge_id', getJudgeId());
    }

    window.onload = function() {
      let savedId = localStorage.getItem('taekwondo_judge_id');
      if (savedId) {
        document.getElementById('judge-id').value = savedId;
      }
    }

    // Dengarkan perintah dari Display/Operator
    channel.bind('control-action', function(data) {
      if (data.action === 'start') {
        timerIsRunning = true;
        ubahStatusAktif(true);
      } else if (data.action === 'pause' || data.action === 'stop' || data.action === 'reset') {
        timerIsRunning = false;
        ubahStatusAktif(false);
      }
    });

    function ubahStatusAktif(aktif) {
      const redBtn = document.getElementById('btn-red');
      const blueBtn = document.getElementById('btn-blue');
      const statusBar = document.getElementById('status-text');

      if (aktif) {
        redBtn.classList.add('active-vote');
        blueBtn.classList.add('active-vote');
        statusBar.innerText = "PERTANDINGAN BERJALAN (SILAHKAN MENILAI)";
        statusBar.style.color = "#4dff4d";
      } else {
        redBtn.classList.remove('active-vote');
        blueBtn.classList.remove('active-vote');
        statusBar.innerText = "MENUNGGU START DARI OPERATOR...";
        statusBar.style.color = "#ffc107";
      }
    }

    async function kirimVote(team) {
      if (!timerIsRunning) return;

      try {
        await fetch('/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ judgeId: getJudgeId(), team })
        });
      } catch (error) {
        console.error('Gagal mengirim vote:', error);
      }
    }
  </script>

</body>
</html>
